<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b2b"><title>Sign in | The Avena</title><link rel="stylesheet" href="styles.css"><style>
.auth-page{min-height:calc(100vh - 82px);display:grid;place-items:center;padding:36px 18px}.login-card{width:min(100%,470px);padding:clamp(24px,5vw,42px);background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}.login-card:before{content:'✳';position:absolute;right:22px;top:12px;color:var(--gold);font-size:28px;animation:spin 14s linear infinite}.login-card .eyebrow{margin-bottom:14px}.login-card h1{font:500 clamp(36px,7vw,52px)/1.04 'Playfair Display',serif;margin:0 0 12px}.login-card p{color:var(--muted);font-size:13px;line-height:1.8}.login-tabs,.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0}.login-tabs button,.role-tabs button{padding:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;font-size:12px}.login-tabs button.active,.role-tabs button.active{background:var(--green);color:var(--bg);border-color:var(--green)}.login-card label{display:block;font-size:11px;font-weight:700;margin:15px 0 7px}.login-card input{width:100%;padding:13px 14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-top:7px;border-radius:2px}.login-card input:focus{outline:2px solid var(--gold);outline-offset:1px}.login-card .btn{width:100%;margin-top:20px}.login-message{min-height:20px;margin-top:13px!important;font-size:12px!important}.login-message.error{color:#b53d31}.login-message.success{color:#387849}.demo-credentials{background:var(--bg);border-left:3px solid var(--gold);padding:12px 14px;margin-top:18px;font-size:11px;color:var(--muted);line-height:1.8}.demo-credentials b{color:var(--ink)}.back-home{display:inline-block;margin-top:18px;font-size:12px;border-bottom:1px solid var(--gold);padding-bottom:4px}.hide{display:none!important}@media(max-width:520px){.auth-page{padding:22px 14px}.login-card{padding:26px 20px}}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/avena-logo.webp" alt="The Avena"><span><b>The Avena</b><small>OAT MEALS &amp; BEYOND</small></span></a><div class="head-actions"><button id="themeToggle" class="theme-toggle" aria-label="Switch theme">☾</button><a class="under-link" href="index.html">← Home</a></div></header>
<main class="auth-page"><section class="login-card"><div class="eyebrow"><i></i> THE AVENA / KITCHEN DESK</div><h1 id="title">Welcome back.</h1><p id="intro">Sign in to continue to The Avena.</p><div class="role-tabs"><button type="button" class="active" data-role="user">◉ User</button><button type="button" data-role="admin">✳ Admin</button></div><div class="login-tabs"><button type="button" class="active" data-mode="login">Sign in</button><button type="button" data-mode="signup">Create account</button></div><form id="loginForm"><div id="nameWrap" class="hide"><label for="name">Full name</label><input id="name" autocomplete="name" placeholder="Your name"></div><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" required minlength="4" autocomplete="current-password" placeholder="Enter password"><div id="codeWrap" class="hide"><label for="adminCode">Demo admin code</label><input id="adminCode" type="password" placeholder="Enter demo code"></div><button class="btn green-btn" id="submitBtn" type="submit">Sign in ↗</button><p id="message" class="login-message" role="status" aria-live="polite"></p></form><div id="demoCredentials" class="demo-credentials"><b>Admin demo access</b><br>Email: admin@theavena.demo<br>Password: AvenaDemo2026!<br>Demo code: AVENA2026</div><a class="back-home" href="index.html">Back to homepage ↗</a></section></main><footer><small>© The Avena · Frontend demo only</small></footer>
<script>
(()=>{const $=id=>document.getElementById(id);let mode='login',role='user';const readUsers=()=>{try{const v=JSON.parse(localStorage.getItem('avena-demo-users')||'[]');return Array.isArray(v)?v:[]}catch(e){return []}};function say(text,type='error'){$('message').textContent=text;$('message').className='login-message '+type}function setMode(v){mode=v;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===v));$('nameWrap').classList.toggle('hide',v!=='signup');$('name').required=v==='signup';$('title').textContent=v==='signup'?'Create your account.':'Welcome back.';$('intro').textContent=v==='signup'?'Create a local demo account to continue.':role==='admin'?'Sign in to manage kitchen records.':'Sign in to continue to The Avena.';$('submitBtn').textContent=v==='signup'?'Create account ↗':'Sign in ↗';$('demoCredentials').classList.toggle('hide',v==='signup'&&role==='user');$('message').textContent='';$('message').className='login-message'}function setRole(v){role=v;document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===v));$('codeWrap').classList.toggle('hide',v!=='admin');$('adminCode').required=v==='admin';$('intro').textContent=role==='admin'?'Sign in to manage kitchen records.':mode==='signup'?'Create a local demo account to continue.':'Sign in to continue to The Avena.';setMode(mode)}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.mode==='signup'&&role==='admin'){say('Admin account creation is disabled. Use the demo admin credentials.');return}setMode(b.dataset.mode)}));document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>setRole(b.dataset.role)));$('loginForm').addEventListener('submit',e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(mode==='signup'){if(role==='admin'){say('Admin account creation is disabled.');return}const name=$('name').value.trim();if(!name){say('Enter your name.');return}let users=readUsers();if(users.some(u=>u.email===email&&u.role==='user')){say('An account already exists. Please sign in.');return}users.push({name,email,password,role:'user'});try{localStorage.setItem('avena-demo-users',JSON.stringify(users))}catch(err){say('Browser storage is unavailable.');return}say('Account created. You can now sign in.','success');setMode('login');$('email').value=email;return}if(role==='admin'){if(email!=='admin@theavena.demo'||password!=='AvenaDemo2026!'||$('adminCode').value!=='AVENA2026'){say('Admin details do not match. Use the demo credentials shown below.');return}sessionStorage.setItem('avena-session',JSON.stringify({name:'Kitchen Admin',email,role:'admin'}));location.href='admin.html';return}const user=readUsers().find(u=>u.email===email&&u.password===password&&u.role==='user');if(!user){say('No matching account. Create an account first.');return}sessionStorage.setItem('avena-session',JSON.stringify({name:user.name,email,role:'user'}));say('Signed in successfully. Welcome, '+user.name+'.','success');setTimeout(()=>location.href='index.html',650)});let t='light';try{t=localStorage.getItem('avena-theme')||'light'}catch(e){}function theme(v){document.body.classList.toggle('dark',v==='dark');$('themeToggle').textContent=v==='dark'?'☀':'☾';try{localStorage.setItem('avena-theme',v)}catch(e){}}theme(t);$('themeToggle').addEventListener('click',()=>theme(document.body.classList.contains('dark')?'light':'dark'));})();
</script></body></html>
